<!DOCTYPE html>
<html>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<body class="d-flex justify-content-center align-items-center vh-100 bg-secondary">
    <div class="card p-4 shadow" style="width: 350px;">
        <h4 class="text-center mb-3 text-primary">Rejestracja ESPhera</h4>
        
        <form action="/register" method="post">
            <div class="mb-3">
                <label>Adres Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Imię / Nazwa</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Hasło</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Utwórz konto</button>
        </form>
        
        <div class="mt-3 text-center border-top pt-2">
            <small>Masz już konto? <a href="/">Zaloguj się</a></small>
        </div>
    </div>
</body>
</html>
