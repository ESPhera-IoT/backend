<!DOCTYPE html>
<html>
<head>
    <title>ESPhera Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">🔮 ESPhera Admin</span>
    <span class="text-white">Zalogowany: {{ user.name }}</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">Wyloguj</a>
  </div>
</nav>

<div class="container mt-4">
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">Dodaj / Przejmij Urządzenie</div>
        <div class="card-body">
            <form action="/claim" method="post" class="row g-3">
                <div class="col-md-4">
                    <input type="text" name="device_name" class="form-control" placeholder="Device Name (np. esp_nowy)" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="aes_key" class="form-control" placeholder="Klucz AES (16 znaków)" required>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-success w-100">Rejestruj</button>
                </div>
            </form>
        </div>
    </div>

    <h3>Moje Kule</h3>
    <div class="row">
        {% for device in devices %}
        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <!-- <span class="">#{{ device.device_id }}</span> -->
                        <h5 class="card-title mb-0">#{{ device.device_id }}</h5>
                        <span class="badge rounded-pill bg-{{ 'success' if device.status == 'paired' else 'warning' }}">
                            {{ device.status }}
                        </span>
                    </div>

                    <!-- <div class="mb-3 p-2 bg-light rounded border">
                        <small class="text-muted d-block">Siła Sygnału WiFi (Czujnik)</small>
                        <div class="d-flex align-items-center">
                            <strong class="me-2">{{ device.rssi }} dBm</strong>
                            <div class="progress flex-grow-1" style="height: 8px;">
                                <div class="progress-bar {{ 'bg-success' if device.rssi > -60 else 'bg-warning' if device.rssi > -80 else 'bg-danger' }}" 
                                    role="progressbar" 
                                    style="width: {{ (device.rssi + 100) }}%"></div> 
                            </div>
                        </div>
                    </div> -->

                    <hr>
                    
                    <form action="/config" method="post">
                        <input type="hidden" name="device_id" value="{{ device.device_id }}">
                        
                        <div class="mb-2">
                            <label class="form-label small fw-bold">Nazwa urządzenia</label>
                            <input type="text" name="device_name" class="form-control" placeholder="Nowa nazwa urządzenia" value="{{ device.device_name }}" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-bold">Jasność LED {{ device.led_intensity }}%</label>
                            <input type="range" class="form-range" name="led_intensity" 
                                   min="0" max="100" value="{{ device.led_intensity }}">
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-bold">Czas do uśpienia:</label>
                            <input type="number" name="sleep_timeout"min="10" max="300" style="text-align: end" value="{{ device.sleep_timeout }}">
                            <span>s</span>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-bold">Głos</label>
                            <select name="sound_model_id" class="form-select form-select-sm">
                                <option value="nPczCjzI2devNBz1zQrb" {% if device.sound_model_id == 'nPczCjzI2devNBz1zQrb' %}selected{% endif %}>
                                    BRIAN
                                </option>
                                <option value="pqHfZKP75CvOlQylNhV4" {% if device.sound_model_id == 'pqHfZKP75CvOlQylNhV4' %}selected{% endif %}>
                                    BILL
                                </option>
                                 <option value="Xb7hH8MSUJpSbSDYk0k2" {% if device.sound_model_id == 'Xb7hH8MSUJpSbSDYk0k2' %}selected{% endif %}>
                                    ALICE
                                </option>
                           
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Osobowość / System Prompt</label>
                            <textarea name="system_prompt" class="form-control form-control-sm" rows="2">{{ device.system_prompt }}</textarea>
                            <small class="text-muted" style="font-size: 0.7em;">Np. "Jesteś sarkastycznym robotem."</small>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-sm w-100">Zapisz Konfigurację</button>
                    </form>
                </div>
            </div>
        </div>
        {% else %}
        <p>Brak urządzeń. Dodaj jakieś!</p>
        {% endfor %}
    </div>
</div>

</body>
</html>
